\* expect: violated LspMatchesDisk
\* module: FormatDrain
\* Mutant of Fix without the start check: after /new the old drain still starts formatting a file the new session has open in its LSP, and its (skipped) sync leaves that document behind the disk.
CONSTANTS
    Edits = 2
    MaxOps = 4
    MaxTurns = 2
    MaxSessions = 2
    ExtWrites = 0
    Overlap = TRUE
    Orphan = TRUE
    MtimeAuthored = FALSE
    ResetClearsGuard = TRUE
    FixQueue = TRUE
    FixQueueHold = TRUE
    FixGen = TRUE
    GenDropsAll = FALSE
    FixStamp = TRUE
    LspGen = TRUE
    StartGen = FALSE
    FixOrphanSync = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NoLostEdit HonestFormatClaim LspMatchesDisk NoBlindAllow NoCrossSessionWrite NoOwnDrop
CHECK_DEADLOCK FALSE

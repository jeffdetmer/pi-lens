\* expect: pass
\* module: ReadGuard
\* Current code without line hashes (a whole-file record over READ_HASH_MAX_LINES); full reads only; FileTime is the only staleness check. (own-edit rescue off: bug 7a.)
CONSTANTS
    N0 = 3
    MaxLen = 4
    AgentOps = 4
    Ops = {"read","edit"}
    Spans = {1,2}
    ExtWrites = 1
    ExtKinds = {"replace","delete","insert"}
    ExtPhases = {"idle"}
    FixKind = "none"
    FormatDrain = "none"
    Bounds = {}
    MaxBounds = 0
    Hashes = FALSE
    Ctx = 0
    HandlerEvidence = FALSE
    CreationHandlerEvidence = TRUE
    MtimeAuthored = FALSE
    OwnEditRescue = FALSE
    ForkImport = TRUE
    SuppressByNewerContext = TRUE
    FormatStamp = TRUE
    RecordAuthoritative = TRUE
    RecordOwnEdit = TRUE
    OwnEditSkipsReloc = TRUE
    SpanSnapshot = FALSE
    RelocFromLatest = FALSE
    ForkAtBoundary = FALSE
    FileTimeCheck = TRUE
    CoverageCheck = TRUE
    SnapshotCheck = TRUE
SPECIFICATION Spec
INVARIANTS NoStaleAllow NoBlindAllow
CHECK_DEADLOCK FALSE

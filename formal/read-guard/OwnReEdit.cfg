\* expect: pass
\* module: ReadGuard
\* Bug 5 (#3523), fixed: the agent re-edits a line it just wrote; its own edit is recorded as a read hashed from its newText.
CONSTANTS
    N0 = 3
    MaxLen = 4
    AgentOps = 3
    Ops = {"read","rread","edit"}
    Spans = {1}
    ExtWrites = 0
    ExtKinds = {"replace"}
    ExtPhases = {"idle"}
    FixKind = "none"
    FormatDrain = "none"
    Bounds = {}
    MaxBounds = 0
    Hashes = TRUE
    Ctx = 0
    HandlerEvidence = FALSE
    CreationHandlerEvidence = TRUE
    MtimeAuthored = FALSE
    OwnEditRescue = TRUE
    ForkImport = TRUE
    SuppressByNewerContext = TRUE
    FormatStamp = TRUE
    RecordAuthoritative = TRUE
    RecordOwnEdit = TRUE
    OwnEditSkipsReloc = TRUE
    SpanSnapshot = FALSE
    RelocFromLatest = FALSE
    ForkAtBoundary = FALSE
    FileTimeCheck = TRUE
    CoverageCheck = TRUE
    SnapshotCheck = TRUE
SPECIFICATION Spec
INVARIANTS NoFalseBlock
CHECK_DEADLOCK FALSE

\* expect: pass
\* module: ReadGuard
\* Fix 5 (#3523, code): a relocated edit is not recorded as a read. Write + autofix, an other-writer insert that lands before the attachment is recorded, a relocated two-line edit, then an edit. The creation read is hashed from the written content here, to keep #3524's creation-read remainder (CreationAtResult) out of this check.
CONSTANTS
    N0 = 4
    MaxLen = 4
    AgentOps = 3
    Ops = {"edit","write"}
    Spans = {1,2}
    ExtWrites = 1
    ExtKinds = {"replace"}
    ExtPhases = {"idle","inflight"}
    FixKind = "delete"
    FormatDrain = "none"
    Bounds = {}
    MaxBounds = 0
    Hashes = TRUE
    Ctx = 0
    HandlerEvidence = FALSE
    CreationHandlerEvidence = FALSE
    MtimeAuthored = FALSE
    OwnEditRescue = TRUE
    ForkImport = TRUE
    SuppressByNewerContext = TRUE
    FormatStamp = TRUE
    RecordAuthoritative = TRUE
    RecordOwnEdit = TRUE
    OwnEditSkipsReloc = TRUE
    SpanSnapshot = FALSE
    RelocFromLatest = FALSE
    ForkAtBoundary = FALSE
    FileTimeCheck = TRUE
    CoverageCheck = TRUE
    SnapshotCheck = TRUE
SPECIFICATION Spec
INVARIANTS NoStaleAllow
CHECK_DEADLOCK FALSE
